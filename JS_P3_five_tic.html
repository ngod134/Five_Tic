<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="JS_P3_five_tic.css">
    </head>
    <body>
        <br><br>
        <div class="main_div">
            <h>Five Tic</h>
            <div>
                <div class="new_restart_game_btn">
                    <button class="new_game_button">New Game</button>
                    <div class="popup_div">
                        <input class="player1_name_input" placeholder="Player1 Name">
                        <select class="player1_list">
                            <option selected="selected" value="X">X</option>
                            <option value="O">O</option>
                        </select>
                        <select class="player1_turn">
                            <option selected="selected" value="Go 1st">Go 1st</option>
                            <option value="Go 2nd">Go 2nd</option>
                            <option value="Random">Random</option>
                        </select>
                        <input class="player2_name_input" placeholder="Player2 Name">
                        <select class="player2_list">
                            <option value="X">X</option>
                            <option selected="selected" value="O">O</option>
                        </select>
                        <select class="player2_turn">
                            <option value="Go 1st">Go 1st</option>
                            <option selected="selected" value="Go 2nd">Go 2nd</option>
                            <option value="Random">Random</option>
                        </select>
                        <button class="select_done_btn">Start!</button>
                    </div>
                    <button class="reset_button">Restart</button>
                    <button class="rule_button">Rule
                        <div class="rule_tooltip">Get 5 X's or O's in any consecutive orders to win</div>
                    </button>
                </div>
                
            </div>
            
            <div class="player_div">
                <p class="player1_win"></p>
                <p class="tie"></p>
                <p class="player2_win"></p>
                <p class="player1">Player1: X</p>
                <p class="Tie_p_tag">Tie</p>
                <p class="player2">Player2: O</p>
                <p class="player1_score">0</p>
                <p class="tie_score">0</p>
                <p class="player2_score">0</p>
            </div>

            
                <div class="grid">
                    <input><input><input><input><input><input><input><input><input><input>
                    <input><input><input><input><input><input><input><input><input><input>
                    <input><input><input><input><input><input><input><input><input><input>
                    <input><input><input><input><input><input><input><input><input><input>
                    <input><input><input><input><input><input><input><input><input><input>
                    <input><input><input><input><input><input><input><input><input><input>
                    <input><input><input><input><input><input><input><input><input><input>
                    <input><input><input><input><input><input><input><input><input><input>
                    <input><input><input><input><input><input><input><input><input><input>
                    <input><input><input><input><input><input><input><input><input><input>
                </div>
                <div class="test_div">
                    <p class="horizontal_line"></p>
                    <p class="vertical_line"></p>
                    <p class="F_diagonal_line"></p>
                    <p class="B_diagonal_line"></p>                    
                </div>
                
            
        </div>

        <script src="JS_P3_five_tic.js"></script>
    </body>
</html>
